worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  access_log off;
  client_body_temp_path /tmp/nx_body;
  proxy_temp_path /tmp/nx_proxy;
  fastcgi_temp_path /tmp/nx_fcgi;
  uwsgi_temp_path /tmp/nx_uwsgi;
  scgi_temp_path /tmp/nx_scgi;
  client_max_body_size 20m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 7860;

    # API — strip the /api prefix. Buffering off so the Copilot's streamed answer
    # reaches the browser token-by-token instead of all at once.
    location /api/ {
      proxy_pass http://127.0.0.1:8000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # Web app
    location / {
      proxy_pass http://127.0.0.1:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 120s;
    }
  }
}
